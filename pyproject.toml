[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "wort-content"
version = "1.0.0"
description = "Build and publish validated learning content for wort_"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8,<9"]

[project.scripts]
wort-content = "wort_content.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/wort_content"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

